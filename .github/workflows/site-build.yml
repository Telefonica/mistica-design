name: Site build

on:
  push:
    branches: [production]
    paths:
      - 'site/**'
      - 'tokens/**'
  pull_request:
    paths:
      - 'site/**'
      - 'tokens/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: site/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
