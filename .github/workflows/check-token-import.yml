name: Check Token Import in mistica-web

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "tokens/schema/skin-schema.json"
    branches:
      - production

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-token-import:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new tokens and validate mistica-web sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/issue-scripts/check-token-import.js');
            await run({ github, context, core });
