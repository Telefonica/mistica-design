name: "Skin Validator"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tokens/**"
      - ".github/workflows/schema-validator.yml"
    branches:
      - pre-production
      - production

jobs:
  validate-skins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skin: [movistar, o2, o2-new, vivo, vivo-new, telefonica, blau, esimflag]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate ${{ matrix.skin }} skin
        id: validation
        uses: cardinalby/schema-validator-action@v1
        with:
          file: "tokens/${{ matrix.skin }}.json"
          schema: "tokens/schema/skin-schema.json"
        continue-on-error: true

      - name: Generate validation report
        if: always()
        run: |
          mkdir -p ./validation-reports
          if [ "${{ steps.validation.outcome }}" == "success" ]; then
            echo "✅ Validation successful" > ./validation-reports/${{ matrix.skin }}.md
          else
            echo "❌ Validation failed" > ./validation-reports/${{ matrix.skin }}.md
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: validation-report-${{ matrix.skin }}
          path: ./validation-reports/${{ matrix.skin }}.md
          retention-days: 5

  summarize:
    needs: validate-skins
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v9

      - name: Create summary comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Collect all validation results
            let comment = '## Skin Validation Results\n\n';
            const skins = ['movistar', 'o2', 'o2-new', 'vivo', 'vivo-new', 'telefonica', 'blau', 'esimflag'];

            for (const skin of skins) {
              try {
                const reportPath = path.join(`validation-report-${skin}`, `${skin}.md`);
                const result = fs.readFileSync(reportPath, 'utf8').trim();
                comment += `* **${skin}**: ${result}\n`;
              } catch (error) {
                comment += `* **${skin}**: ⚠️ Report not available\n`;
              }
            }

            // Post comment to PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
