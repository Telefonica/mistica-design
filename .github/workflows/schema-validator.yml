name: "Skin Validator"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tokens/**"
      - ".github/workflows/schema-validator.yml"
    branches:
      - pre-production
      - production

permissions:
  contents: read

jobs:
  validate-skins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skin:
          [
            movistar,
            movistar-new,
            o2,
            o2-new,
            vivo,
            vivo-new,
            vivo-evolution,
            telefonica,
            blau,
            esimflag,
          ]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Validate ${{ matrix.skin }} skin
        id: validation
        uses: cardinalby/schema-validator-action@v1
        with:
          file: "tokens/${{ matrix.skin }}.json"
          schema: "tokens/schema/skin-schema.json"
