name: "Skin Validator"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tokens/**"
      - ".github/workflows/schema-validator.yml"
    branches:
      - pre-production
      - production

jobs:
  validate-skins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skin: [movistar, o2, o2-new, vivo, vivo-new, telefonica, blau, esimflag]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate ${{ matrix.skin }} skin
        id: validation
        uses: cardinalby/schema-validator-action@v1
        with:
          file: "tokens/${{ matrix.skin }}.json"
          schema: "tokens/schema/skin-schema.json"
        continue-on-error: true

      # Save the validation output to a file even if validation fails
      - name: Store validation results
        if: always()
        run: |
          mkdir -p ./validation-reports
          echo "### Validation for ${{ matrix.skin }}" > ./validation-reports/${{ matrix.skin }}.md
          echo "\`\`\`" >> ./validation-reports/${{ matrix.skin }}.md
          if [ "${{ steps.validation.outcome }}" == "success" ]; then
            echo "✅ Validation successful" >> ./validation-reports/${{ matrix.skin }}.md
          else
            echo "❌ Error: Validation failed for ${{ matrix.skin }}" >> ./validation-reports/${{ matrix.skin }}.md
            # Try to capture any stdout/stderr from the validation step
            echo "${{ steps.validation.outputs.stdout || '' }}" >> ./validation-reports/${{ matrix.skin }}.md
            echo "${{ steps.validation.outputs.stderr || '' }}" >> ./validation-reports/${{ matrix.skin }}.md
          fi
          echo "\`\`\`" >> ./validation-reports/${{ matrix.skin }}.md

      # Upload the report as an artifact
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ matrix.skin }}
          path: ./validation-reports/${{ matrix.skin }}.md
          retention-days: 5

  # Create or update a comment on the PR with the validation results
  comment-pr:
    needs: validate-skins
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download all validation reports
        uses: dawidd6/action-download-artifact@v9
        with:
          path: ./validation-reports

      - name: Collect validation results
        id: results
        run: |
          echo "COMMENT_BODY<<EOF" >> $GITHUB_ENV
          echo "# Skin Validation Results" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          # Loop through all validation reports
          for dir in ./validation-reports/validation-report-*; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.md; do
                if [ -f "$file" ]; then
                  cat "$file" >> $GITHUB_ENV
                  echo "" >> $GITHUB_ENV
                  echo "" >> $GITHUB_ENV
                fi
              done
            fi
          done
          echo "EOF" >> $GITHUB_ENV

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Skin Validation Results"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.COMMENT_BODY }}
          edit-mode: replace
