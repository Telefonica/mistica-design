name: Screenshot test

# push:
#   paths:
#     - ".github/workflows/figma-export.yml"

on:
  workflow_dispatch:
    inputs:
      branchID:
        description: "Put Figma BranchID to generate screenshot testing"
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN}}

jobs:
  screenshot-test:
    name: Acceptance tests
    runs-on: ubuntu-latest
    env:
      BRANCH_ID: ${{ github.event.inputs.branchID }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate branch ID format
        run: |
          if [[ ! "$BRANCH_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid branch ID format. Only alphanumeric, dash and underscore allowed."
            exit 1
          fi

      - name: Checkout branch or create new one
        run: |
          git fetch
          if git branch -a | grep "origin/acceptance-tests"; then
              git checkout acceptance-tests
          else
              git checkout -b acceptance-tests
          fi

      - name: Instalar Homebrew
        run: |
          sudo apt-get install -y librsvg2-bin
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Update master to last version
        run: npx -p @figma-export/cli -p @figma-export/output-components-as-svg figma-export components WCkDDzlXE16R6yXaljxddj -O @figma-export/output-components-as-svg

      - name: convert-svg2png
        run: |
          find output -type f -name "*.svg" -exec rsvg-convert --dpi-x=200 --dpi-y=200 {} -o {}.png \;
          find output -type f -name "*.svg" -exec rm -f {} \;

      - name: Check if there are any changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Screenshot tests from master"
          git push origin acceptance-tests

      - name: Checkout branch or create new one
        run: |
          git fetch
          if git branch -a | grep "origin/$BRANCH_ID"; then
              git checkout "$BRANCH_ID"
          else
              git checkout -b "$BRANCH_ID"
          fi

      - name: Export new screenshots
        run: npx -p @figma-export/cli -p @figma-export/output-components-as-svg figma-export components "$BRANCH_ID" -O @figma-export/output-components-as-svg

      - name: convert-svg2png
        run: |
          find output -type f -name "*.svg" -exec rsvg-convert --dpi-x=200 --dpi-y=200 {} -o {}.png \;
          find output -type f -name "*.svg" -exec rm -f {} \;

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Screenshot tests from $BRANCH_ID"
          git push origin "$BRANCH_ID"

      - name: Create Pull-Request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.BRANCH_ID }}
          destination_branch: "acceptance-tests"
          pr_title: "Acceptance tests for ${{ env.BRANCH_ID }} file"
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
